# Optional verification model: Qwen3-0.6B on vLLM CPU (no GPU needed), published through MaaS.
# Publishing a model to MaaS takes 4 objects:
#   LLMInferenceService  runs vLLM and attaches it to maas-default-gateway
#   MaaSModelRef         registers the model with MaaS (shows up in /v1/models)
#   MaaSAuthPolicy       who may call it
#   MaaSSubscription     how many tokens they get; API keys are bound to a subscription
apiVersion: v1
kind: Namespace
metadata:
  name: maas-demo
  labels:
    maas.opendatahub.io/gateway-access: "true"   # allow routes on the MaaS gateway
    opendatahub.io/dashboard: "true"
---
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen3-0-6b
  namespace: maas-demo
  annotations:
    openshift.io/display-name: Qwen3-0.6B (MaaS sample)
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "true"
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
spec:
  model:
    name: qwen3-0-6b
    uri: hf://Qwen/Qwen3-0.6B
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: registry.redhat.io/rhaiis/vllm-cpu-rhel9@sha256:f05e773647dddd37ec6c2215cb14bec87e4ab5a7d37f2e110d16cd92355427d3
        command: [python, -m, vllm.entrypoints.openai.api_server]
        args:
          - --served-model-name=qwen3-0-6b
          - --model=/mnt/models
          - --max-model-len=2048
          - --enable-ssl-refresh
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
          - --enable-force-include-usage   # MaaS counts tokens from the usage field
        env:
          - name: HF_HOME
            value: /tmp/hf_home
          - name: VLLM_CPU_KVCACHE_SPACE
            value: "4"
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet: {path: /health, port: 8000, scheme: HTTPS}
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet: {path: /health, port: 8000, scheme: HTTPS}
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 40
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "8"
            memory: 16Gi
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: qwen3-0-6b
  namespace: maas-demo
spec:
  modelRef:
    kind: LLMInferenceService
    name: qwen3-0-6b
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: qwen3-0-6b-access
  namespace: models-as-a-service
spec:
  modelRefs:
    - name: qwen3-0-6b
      namespace: maas-demo
  subjects:
    groups:
      - name: system:authenticated   # every logged-in OpenShift user
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: qwen3-0-6b-sample
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: qwen3-0-6b
      namespace: maas-demo
      tokenRateLimits:
        - limit: 1000
          window: 1m
  priority: 10
